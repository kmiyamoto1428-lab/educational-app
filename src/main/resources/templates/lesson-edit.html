<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Lesson</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Edit Lesson</h1>

    <form th:action="@{/lessons/{id}/edit(id=${lesson.id})}" method="post">

        <div>
            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   th:value="${lesson.title}"
                   required>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea id="description"
                      name="description"
                      th:text="${lesson.description}"></textarea>
        </div>

        <button type="submit">Update</button>

    </form>

    <a th:href="@{/lessons/{id}(id=${lesson.id})}">Back to Lesson</a>

</body>
</html>
